# Banco de desenvolvimento do NAÇÃO | GESTÃO DE HORAS.
#   docker compose up -d --wait
services:
  db:
    image: postgres:16
    container_name: nacao-horas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nacao
      POSTGRES_PASSWORD: nacao
      POSTGRES_DB: nacao_horas
    ports:
      - '5432:5432'
    volumes:
      - nacao-horas-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nacao -d nacao_horas']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  nacao-horas-data:
